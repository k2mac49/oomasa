<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>屋台レジ（オフライン版）</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:rgba(0,0,0,0);}
  html,body{height:100%;}
  body{background:#0f172a; color:#f1f5f9; font-family:sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none;}
  button{font-family:inherit; cursor:pointer; outline:none;}
  .hide{display:none !important;}

  #app{display:flex; flex-direction:column; height:100%;}

  /* 上部タブ */
  .tabs{display:flex; background:#1e293b; border-bottom:1px solid #475569; padding:5px 3px;}
  .tabs button{flex:1; margin:0 3px; padding:10px 0; border:0; border-radius:9px;
    background:transparent; color:#94a3b8; font-size:16px; font-weight:bold;}
  .tabs button.on{background:#334155; color:#f1f5f9;}

  /* 保存できない警告 */
  #noStore{background:#ef4444; color:#fff; font-size:13px; font-weight:bold; padding:6px 10px; text-align:center;}

  .page{flex:1; min-height:0; display:flex; flex-direction:column;}

  /* レジ：商品／電卓 切替 */
  .seg{display:flex; padding:6px 3px 0;}
  .seg button{flex:1; margin:0 3px; padding:9px 0; border:1px solid #475569; border-radius:9px;
    background:#1e293b; color:#94a3b8; font-size:15px; font-weight:bold;}
  .seg button.on{background:#334155; color:#f1f5f9; border-color:#22c55e;}

  #regBody{flex:1; min-height:0; display:flex; flex-direction:column; padding:6px;}
  .panel{flex:1; min-height:0; display:flex; flex-direction:column;}

  /* 商品パネル */
  .head{display:flex; align-items:center; background:#1e293b; border:1px solid #475569;
    border-radius:11px; padding:8px 10px; margin-bottom:7px;}
  .head .lbl{font-size:13px; color:#94a3b8; margin-right:8px;}
  .head .tot{flex:1; font-size:30px; font-weight:bold;}
  .disc .head .tot{color:#ef4444;}
  #discBtn{border:1px solid #475569; background:#0f172a; color:#f1f5f9; font-size:14px;
    font-weight:bold; padding:9px 12px; border-radius:9px;}
  #discBtn.on{background:#f5c400; color:#111; border-color:#111;
    background-image:repeating-linear-gradient(45deg,#f5c400 0,#f5c400 10px,#111 10px,#111 20px);}
  #discBtn.on span{background:#111; color:#f5c400; padding:2px 8px; border-radius:5px;}

  .list{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .prod{display:flex; align-items:center; background:#1e293b; border:1px solid #475569;
    border-radius:11px; padding:8px 10px; margin-bottom:7px;}
  .prod.on{border-color:#ef4444;}
  .prod .info{flex:1; min-width:0;}
  .prod .nm{font-size:19px; font-weight:bold;}
  .prod .pr{font-size:13px; color:#94a3b8; margin-top:2px;}
  .prod .pr s{color:#64748b; margin-right:5px;}
  .prod .pr b{color:#ef4444;}
  .prod .sub{font-size:14px; font-weight:bold; min-width:62px; text-align:right; margin-right:8px;}
  .prod button{width:50px; height:50px; border:1px solid #475569; background:#334155; color:#f1f5f9;
    font-size:26px; border-radius:11px; line-height:1;}
  .prod button.plus{background:#16a34a; border-color:#16a34a; color:#052e16; font-weight:bold;}
  .prod button[disabled]{opacity:.35;}
  .prod .cnt{min-width:40px; text-align:center; font-size:24px; font-weight:bold;}

  /* 電卓パネル */
  .row{display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px;}
  .row .lbl{font-size:13px; color:#94a3b8;}
  .row .v{font-size:20px; font-weight:bold;}
  .row.big .v{font-size:30px;}
  .disc .row.big .v{color:#ef4444;}
  #recv{color:#38bdf8;}
  #chgBox{display:flex; align-items:baseline; justify-content:space-between; background:#334155;
    border-radius:10px; padding:7px 12px; margin:5px 0;}
  #chgBox .lbl{font-size:14px; font-weight:bold;}
  #chg{font-size:26px; font-weight:bold; color:#22c55e;}
  #chgBox.short #chg{color:#ef4444;}

  .krow{display:flex;}
  .krow button{flex:1; margin:3px; border:1px solid #475569; background:#334155; color:#f1f5f9;
    font-size:22px; font-weight:bold; border-radius:10px;}
  .quick button{height:40px; font-size:14px; background:#0f172a;}
  .keypad{flex:1; min-height:0; display:flex; flex-direction:column;}
  .keypad .krow{flex:1; min-height:0;}
  .keypad button.fn{background:#475569; font-size:15px;}
  .keypad button.del{color:#ef4444;}
  .acts{display:flex;}
  .acts button{height:52px; margin:3px; border:0; border-radius:10px; font-size:16px; font-weight:bold;}
  #clearAll{flex:1; background:#334155; color:#f1f5f9;}
  #payBtn{flex:1.3; background:#22c55e; color:#052e16;}
  #payBtn[disabled]{opacity:.4;}

  /* 横向きの広い画面では商品と電卓を左右に並べる */
  @media (min-width:900px){
    .seg{display:none;}
    #regBody{flex-direction:row;}
    #panelProd,#panelCalc{display:flex !important;}
    #panelProd{margin-right:8px;}
    #panelCalc{flex:none; width:380px;}
  }

  /* 売上 */
  #pageSales{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px;}
  .box{background:#1e293b; border:1px solid #475569; border-radius:11px; padding:10px; margin-bottom:8px;}
  .set label{display:block; font-size:12px; color:#94a3b8; margin:4px 0 3px;}
  .set input{width:100%; background:#0f172a; color:#f1f5f9; border:1px solid #475569;
    border-radius:8px; padding:9px; font-size:16px; font-family:inherit;}
  .cards{display:flex; margin-bottom:8px;}
  .card{flex:1; background:#1e293b; border:1px solid #475569; border-radius:11px; padding:9px 10px; margin-right:6px;}
  .card:last-child{margin-right:0;}
  .card .lbl{font-size:12px; color:#94a3b8;}
  .card .big{font-size:22px; font-weight:bold; margin-top:2px;}
  .card.t .big{color:#22c55e;}
  .btns{display:flex; margin-bottom:8px;}
  .btns button{flex:1; margin-right:6px; padding:12px 6px; border:0; border-radius:10px;
    font-size:14px; font-weight:bold;}
  .btns button:last-child{margin-right:0;}
  #csvSave{background:#38bdf8; color:#052e16;}
  #csvShow{background:#334155; color:#f1f5f9;}
  #clearData{background:transparent; border:1px solid #ef4444 !important; color:#ef4444;}
  .day{background:#1e293b; border:1px solid #475569; border-radius:11px; margin-bottom:8px; overflow:hidden;}
  .dh{background:#334155; padding:10px 12px;}
  .dh .d{font-size:15px; font-weight:bold;}
  .dh .e{font-size:13px; color:#38bdf8; font-weight:bold; margin-left:8px;}
  .dh .s{float:right; font-size:18px; font-weight:bold; color:#22c55e;}
  .dh .m{font-size:11px; color:#94a3b8; margin-top:4px; clear:both;}
  .dh .m b{color:#ef4444;}
  .db{padding:10px 12px;}
  .db h4{font-size:13px; color:#94a3b8; margin:2px 0 6px;}
  .db table{width:100%; border-collapse:collapse; margin-bottom:10px;}
  .db td{padding:6px 3px; border-bottom:1px solid #475569; font-size:14px;}
  .db td.r{text-align:right; font-weight:bold;}
  .db .c{color:#38bdf8; font-weight:bold;}
  .db .dc{color:#ef4444; font-size:11px; font-weight:bold; margin-left:5px;}
  .tx{border:1px solid #475569; border-radius:9px; padding:7px 10px; margin-bottom:6px; background:#0f172a;}
  .tx.d{border-color:#ef4444;}
  .tx .h{overflow:hidden;}
  .tx .no{font-size:13px; font-weight:bold;}
  .tx .tm{font-size:11px; color:#94a3b8; margin-left:5px;}
  .tx .a{float:right; font-size:15px; font-weight:bold;}
  .tx .l{font-size:12px; color:#94a3b8; margin-top:2px;}
  .tx .dr{font-size:11px; color:#ef4444; font-weight:bold; margin-top:3px;}
  .empty{color:#94a3b8; text-align:center; padding:24px 0;}

  /* モーダル */
  .mbg{position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.65); z-index:20;
    display:flex; align-items:center; justify-content:center; padding:12px;}
  .modal{background:#1e293b; border:1px solid #475569; border-radius:14px; padding:14px;
    width:100%; max-width:460px; max-height:92%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .modal h3{font-size:17px; margin-bottom:6px;}
  .modal p{font-size:12px; color:#94a3b8; line-height:1.5; margin-bottom:8px;}
  .dr2{border:2px solid #475569; border-radius:10px; padding:9px 10px; margin-bottom:8px;}
  .dr2.sel{border-color:#f5c400; background:#262a1e;}
  .dr2 .pn{font-size:15px; font-weight:bold; margin-bottom:7px;}
  .dr2 .pc{display:flex; align-items:center;}
  .dr2 .pc button{height:42px; min-width:52px; padding:0 8px; border:1px solid #475569; background:#0f172a;
    color:#f1f5f9; font-size:14px; font-weight:bold; border-radius:9px;}
  .dr2 .pc button[disabled]{opacity:.3;}
  .dr2 .pc button.hf{margin-left:6px; border-color:#9a3412;}
  .dr2 .pc button.hf.act{background:#7c2d12; color:#fed7aa;}
  .dr2 .pv{flex:1; text-align:center; font-size:14px; font-weight:bold; white-space:nowrap;}
  .dr2 .pv.z{color:#94a3b8;}
  .dr2 .pv i{font-style:normal; color:#ef4444; font-size:12px; margin:0 5px;}
  .dr2 .pv em{font-style:normal; color:#ef4444;}
  .mb{display:block; width:100%; margin-top:7px; border-radius:10px; font-size:15px; font-weight:bold;}
  #dApply{height:48px; border:0; background:#f5c400; color:#111;}
  #dClear{height:44px; border:1px solid #ef4444; background:transparent; color:#ef4444;}
  .mclose{height:40px; border:0; background:transparent; color:#94a3b8;}
  #csvText{width:100%; height:240px; background:#0f172a; color:#f1f5f9; border:1px solid #475569;
    border-radius:8px; padding:8px; font-size:12px; font-family:monospace; -webkit-user-select:text; user-select:text;}

  #toast{position:fixed; left:50%; bottom:22px; width:300px; margin-left:-150px; text-align:center;
    background:#22c55e; color:#052e16; font-weight:bold; padding:12px 10px; border-radius:24px;
    font-size:15px; z-index:30; opacity:0; -webkit-transition:opacity .25s; transition:opacity .25s; pointer-events:none;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button id="tabReg" class="on">🧾 レジ</button>
    <button id="tabSales">📊 売上 <span id="tabCnt"></span></button>
  </div>
  <div id="noStore" class="hide">⚠ この開き方では売上が保存されません。Chromeなどのブラウザで開き直してください</div>

  <!-- レジ -->
  <div class="page" id="pageReg">
    <div class="seg">
      <button id="segProd" class="on">🍢 商品</button>
      <button id="segCalc">🧮 電卓</button>
    </div>
    <div id="regBody">
      <div class="panel" id="panelProd">
        <div class="head">
          <span class="lbl">合計</span><span class="tot tv">¥0</span>
          <button id="discBtn"><span id="discTxt">値引き</span></button>
        </div>
        <div class="list" id="list"></div>
      </div>
      <div class="panel hide" id="panelCalc">
        <div class="row big"><span class="lbl">合計</span><span class="v tv">¥0</span></div>
        <div class="row"><span class="lbl">預り金</span><span class="v" id="recv">¥0</span></div>
        <div id="chgBox"><span class="lbl">おつり</span><span id="chg">¥0</span></div>
        <div class="krow quick" id="quick">
          <button data-q="1000">+1000</button><button data-q="5000">+5000</button><button data-q="10000">+10000</button>
        </div>
        <div class="keypad" id="keypad">
          <div class="krow"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button></div>
          <div class="krow"><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button></div>
          <div class="krow"><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button></div>
          <div class="krow"><button data-k="00" class="fn">00</button><button data-k="0">0</button><button data-k="del" class="fn del">←</button></div>
        </div>
        <div class="acts">
          <button id="clearAll">取消</button>
          <button id="payBtn" disabled>会計する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 売上 -->
  <div class="page hide" id="pageSales">
    <div class="box set">
      <label>営業日</label><input type="date" id="bizdate">
      <label>イベント</label><input type="text" id="ev" placeholder="例：夏祭り 屋台">
    </div>
    <div class="cards">
      <div class="card t"><div class="lbl">総売上</div><div class="big" id="gTotal">¥0</div></div>
      <div class="card"><div class="lbl">営業日数</div><div class="big" id="gDays">0</div></div>
      <div class="card"><div class="lbl">総会計</div><div class="big" id="gCount">0</div></div>
    </div>
    <div class="btns">
      <button id="csvSave">⬇ CSV保存</button>
      <button id="csvShow">CSVを表示</button>
      <button id="clearData">全消去</button>
    </div>
    <div id="days"></div>
  </div>
</div>

<!-- 値引きモーダル -->
<div class="mbg hide" id="discModal">
  <div class="modal">
    <h3>🏷️ 値引き設定（商品ごと）</h3>
    <p>−100で値下げ／＋100で戻す（定価超え・0円以下は不可）。適用中は解除するまで継続。営業日を変えると自動で解除。</p>
    <div id="dRows"></div>
    <button class="mb" id="dApply">この内容で適用</button>
    <button class="mb" id="dClear">すべて解除</button>
    <button class="mb mclose" id="dClose">閉じる</button>
  </div>
</div>

<!-- CSV表示モーダル -->
<div class="mbg hide" id="csvModal">
  <div class="modal">
    <h3>CSV（コピー用）</h3>
    <p>全選択してコピーし、メモやメールに貼り付けて保存できます。</p>
    <textarea id="csvText" readonly></textarea>
    <button class="mb" id="csvSel" style="height:44px;border:0;background:#38bdf8;color:#052e16;">全選択</button>
    <button class="mb mclose" id="csvClose">閉じる</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  /* ===== 商品マスタ ===== */
  var PRODUCTS = [
    {name:"焼うどん", price:600},
    {name:"豚バラ",   price:600},
    {name:"梅酒",     price:500}
  ];
  var STORE = "regmock_txns_v2", DSTORE = "regmock_disc_v2";
  var N = PRODUCTS.length;

  /* ===== 小道具（古いブラウザ対応のため素朴に） ===== */
  function $(id){ return document.getElementById(id); }
  function comma(n){
    var neg = n < 0, s = String(Math.abs(Math.round(n))), out = "";
    while(s.length > 3){ out = "," + s.slice(-3) + out; s = s.slice(0, -3); }
    return (neg ? "-" : "") + s + out;
  }
  function yen(n){ return "¥" + comma(n); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function nowTime(){ var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fillArr(v){ var a = []; for(var i=0;i<N;i++) a.push(v); return a; }
  function show(el, on){ if(on) el.className = el.className.replace(/\s*\bhide\b/g, ""); else if(!/\bhide\b/.test(el.className)) el.className += " hide"; }
  function setOn(el, on){ toggleClass(el, "on", on); }
  function toggleClass(el, c, on){
    var re = new RegExp("(^|\\s)" + c + "(\\s|$)");
    var has = re.test(el.className);
    if(on && !has) el.className = (el.className + " " + c).replace(/^\s+/, "");
    if(!on && has) el.className = el.className.replace(re, " ").replace(/^\s+|\s+$/g, "");
  }
  /* クリックされた要素から、指定属性を持つ親をたどる（closest の代わり） */
  function up(el, attr, root){
    while(el && el !== root){
      if(el.getAttribute && el.getAttribute(attr) !== null) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* ===== 保存 ===== */
  var canStore = (function(){
    try{ localStorage.setItem("__t","1"); var ok = localStorage.getItem("__t") === "1"; localStorage.removeItem("__t"); return ok; }
    catch(e){ return false; }
  })();
  function load(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  if(!canStore) show($("noStore"), true);

  /* ===== 状態 ===== */
  var counts = fillArr(0), received = 0;
  var txns = load(STORE, []); if(!(txns instanceof Array)) txns = [];
  var discounts = fillArr(null);
  var draft = [];

  var bd = $("bizdate"), ev = $("ev");
  bd.value = today();
  (function(){
    var s = load(DSTORE, null);
    if(s && s.discounts && s.discounts.length === N && s.date === bd.value) discounts = s.discounts;
  })();
  function saveDisc(){ save(DSTORE, {discounts:discounts, date:bd.value}); }

  bd.onchange = function(){
    if(anyDisc()){ discounts = fillArr(null); saveDisc(); toast("営業日変更のため値引きを解除しました", 1600); }
    render();
  };

  /* ===== 価格計算 ===== */
  function eff(i){
    var p = PRODUCTS[i].price, d = discounts[i];
    if(!d) return p;
    if(d.type === "half") return Math.floor(p / 2);
    return Math.max(0, p - d.value);
  }
  function anyDisc(){ for(var i=0;i<N;i++) if(discounts[i]) return true; return false; }
  function discCount(){ var c=0; for(var i=0;i<N;i++) if(discounts[i]) c++; return c; }
  function net(){ var s=0; for(var i=0;i<N;i++) s += counts[i] * eff(i); return s; }

  /* ===== 商品リスト ===== */
  var list = $("list"), html = "";
  for(var i=0;i<N;i++){
    html += '<div class="prod" id="row'+i+'">' +
      '<div class="info"><div class="nm">'+esc(PRODUCTS[i].name)+'</div><div class="pr" id="pr'+i+'"></div></div>' +
      '<span class="sub" id="sub'+i+'">¥0</span>' +
      '<button data-act="minus" data-i="'+i+'" id="minus'+i+'">−</button>' +
      '<span class="cnt" id="cnt'+i+'">0</span>' +
      '<button class="plus" data-act="plus" data-i="'+i+'">＋</button>' +
    '</div>';
  }
  list.innerHTML = html;
  list.onclick = function(e){
    var b = up(e.target, "data-act", list); if(!b || b.disabled) return;
    var i = +b.getAttribute("data-i");
    counts[i] = Math.max(0, counts[i] + (b.getAttribute("data-act") === "plus" ? 1 : -1));
    render();
  };

  /* ===== 電卓 ===== */
  $("keypad").onclick = function(e){
    var b = up(e.target, "data-k", this); if(!b) return;
    var k = b.getAttribute("data-k"), s = String(received);
    if(k === "del") s = s.length <= 1 ? "0" : s.slice(0, -1);
    else if(k === "00") s = s === "0" ? "0" : s + "00";
    else s = s === "0" ? k : s + k;
    received = Math.min(99999999, parseInt(s, 10) || 0);
    render();
  };
  $("quick").onclick = function(e){
    var b = up(e.target, "data-q", this); if(!b) return;
    received = Math.min(99999999, received + parseInt(b.getAttribute("data-q"), 10));
    render();
  };

  /* ===== 描画 ===== */
  function render(){
    var any = false, i;
    for(i=0;i<N;i++){
      var p = PRODUCTS[i].price, e = eff(i), on = !!discounts[i];
      $("cnt"+i).innerHTML = counts[i];
      $("sub"+i).innerHTML = yen(counts[i] * e);
      $("minus"+i).disabled = counts[i] === 0;
      $("pr"+i).innerHTML = on ? "<s>"+yen(p)+"</s><b>"+yen(e)+"</b>" : yen(p);
      toggleClass($("row"+i), "on", on);
      if(counts[i] > 0) any = true;
    }
    var t = net();
    var tv = document.querySelectorAll(".tv");
    for(i=0;i<tv.length;i++) tv[i].innerHTML = yen(t);
    $("recv").innerHTML = yen(received);

    toggleClass($("pageReg"), "disc", anyDisc());
    toggleClass($("discBtn"), "on", anyDisc());
    $("discTxt").innerHTML = anyDisc() ? "値引き中 " + discCount() + "品" : "値引き";

    var ch = received - t;
    if(received > 0 && ch < 0){ toggleClass($("chgBox"), "short", true); $("chg").innerHTML = "不足 " + yen(-ch); }
    else { toggleClass($("chgBox"), "short", false); $("chg").innerHTML = yen(Math.max(0, ch)); }
    $("payBtn").disabled = !(any && received >= t);
  }

  /* ===== 会計 ===== */
  $("payBtn").onclick = function(){
    if(this.disabled) return;
    var items = [], gross = 0, total = 0, i, maxId = 0;
    for(i=0;i<N;i++){
      if(counts[i] > 0){
        var u = eff(i);
        items.push({name:PRODUCTS[i].name, price:PRODUCTS[i].price, count:counts[i], unit:u});
        gross += PRODUCTS[i].price * counts[i];
        total += u * counts[i];
      }
    }
    for(i=0;i<txns.length;i++) if((txns[i].id||0) > maxId) maxId = txns[i].id;
    txns.push({
      id:maxId+1, date:bd.value || "未設定", event:(ev.value||"").replace(/^\s+|\s+$/g,""),
      time:nowTime(), items:items, subtotal:gross, discount:gross-total, total:total,
      received:received, change:received-total
    });
    save(STORE, txns);
    toast("会計完了　おつり " + yen(received - total), 1800);
    counts = fillArr(0); received = 0;
    render(); renderSales(); showPanel("prod");
  };
  $("clearAll").onclick = function(){ counts = fillArr(0); received = 0; render(); };

  /* ===== 商品／電卓 切替 ===== */
  function showPanel(w){
    show($("panelProd"), w === "prod"); show($("panelCalc"), w === "calc");
    setOn($("segProd"), w === "prod"); setOn($("segCalc"), w === "calc");
  }
  $("segProd").onclick = function(){ showPanel("prod"); };
  $("segCalc").onclick = function(){ showPanel("calc"); };

  /* ===== タブ ===== */
  $("tabReg").onclick = function(){ show($("pageReg"), true); show($("pageSales"), false); setOn(this, true); setOn($("tabSales"), false); };
  $("tabSales").onclick = function(){ show($("pageReg"), false); show($("pageSales"), true); setOn(this, true); setOn($("tabReg"), false); renderSales(); };

  /* ===== 値引きモーダル ===== */
  var dRows = $("dRows"), dh = "";
  for(var j=0;j<N;j++){
    dh += '<div class="dr2" data-i="'+j+'" id="dr'+j+'"><div class="pn">'+esc(PRODUCTS[j].name)+'</div><div class="pc">' +
      '<button data-a="down" id="dn'+j+'">−100</button><span class="pv" id="pv'+j+'"></span>' +
      '<button data-a="up" id="upb'+j+'">＋100</button><button class="hf" data-a="half" id="hf'+j+'">半額</button></div></div>';
  }
  dRows.innerHTML = dh;
  function drawDraft(){
    for(var i=0;i<N;i++){
      var d = draft[i], price = PRODUCTS[i].price;
      var cur = d.type === "amount" ? d.value : 0;
      var cp = d.type === "half" ? Math.floor(price/2) : price - cur;
      var set = d.type === "half" || cur > 0;
      $("pv"+i).innerHTML = set ? yen(price)+'<i>−'+yen(price-cp)+'→</i><em>'+yen(cp)+'</em>' : yen(price);
      $("pv"+i).className = "pv" + (set ? "" : " z");
      toggleClass($("hf"+i), "act", d.type === "half");
      toggleClass($("dr"+i), "sel", set);
      $("dn"+i).disabled = d.type === "half" || cp <= 100;
      $("upb"+i).disabled = d.type === "half" || cur === 0;
    }
  }
  dRows.onclick = function(e){
    var b = up(e.target, "data-a", dRows); if(!b || b.disabled) return;
    var row = up(b, "data-i", dRows); if(!row) return;
    var i = +row.getAttribute("data-i"), a = b.getAttribute("data-a"), price = PRODUCTS[i].price;
    var cur = draft[i].type === "amount" ? draft[i].value : 0;
    if(a === "half") draft[i] = draft[i].type === "half" ? {type:"amount", value:0} : {type:"half"};
    else if(a === "down") draft[i] = {type:"amount", value:Math.min(price-100, cur+100)};
    else draft[i] = {type:"amount", value:Math.max(0, cur-100)};
    drawDraft();
  };
  $("discBtn").onclick = function(){
    draft = [];
    for(var i=0;i<N;i++){
      var d = discounts[i];
      draft.push(d ? (d.type === "half" ? {type:"half"} : {type:"amount", value:d.value}) : {type:"amount", value:0});
    }
    drawDraft(); show($("discModal"), true);
  };
  $("dClose").onclick = function(){ show($("discModal"), false); };
  $("dApply").onclick = function(){
    for(var i=0;i<N;i++){
      var d = draft[i];
      discounts[i] = d.type === "half" ? {type:"half"} : (d.value > 0 ? {type:"amount", value:d.value} : null);
    }
    saveDisc(); show($("discModal"), false); render();
    toast(anyDisc() ? "値引きを適用しました（" + discCount() + "品）" : "値引きなしに設定しました", 1500);
  };
  $("dClear").onclick = function(){
    discounts = fillArr(null); saveDisc(); show($("discModal"), false); render();
    toast("すべての値引きを解除しました", 1400);
  };

  /* ===== CSV ===== */
  function csvCell(v){ var s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function buildCSV(){
    var rows = [["日付","イベント","会計No","時刻","商品","通常単価","適用単価","単価値引き","個数","金額","会計小計","会計値引き計","会計合計","預り金","おつり"]];
    var arr = txns.slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id; });
    for(var i=0;i<arr.length;i++){
      var t = arr[i];
      for(var k=0;k<t.items.length;k++){
        var it = t.items[k], u = it.unit != null ? it.unit : it.price, f = k === 0;
        rows.push([t.date, t.event||"", t.id, t.time, it.name, it.price, u, it.price-u, it.count, u*it.count,
          f ? (t.subtotal != null ? t.subtotal : t.total) : "", f ? (t.discount||0) : "",
          f ? t.total : "", f ? t.received : "", f ? t.change : ""]);
      }
    }
    var out = [];
    for(var r=0;r<rows.length;r++){ var line = []; for(var c=0;c<rows[r].length;c++) line.push(csvCell(rows[r][c])); out.push(line.join(",")); }
    return out.join("\r\n");
  }
  $("csvSave").onclick = function(){
    if(!txns.length){ toast("書き出すデータがありません", 1400); return; }
    try{
      var blob = new Blob(["﻿" + buildCSV()], {type:"text/csv"});
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "売上_" + (bd.value || "all") + ".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      toast("保存できない場合は「CSVを表示」でコピーしてください", 2400);
    }catch(e){ openCsv(); }
  };
  function openCsv(){ $("csvText").value = buildCSV(); show($("csvModal"), true); }
  $("csvShow").onclick = function(){
    if(!txns.length){ toast("書き出すデータがありません", 1400); return; }
    openCsv();
  };
  $("csvSel").onclick = function(){ var t = $("csvText"); t.focus(); t.select(); try{ t.setSelectionRange(0, t.value.length); }catch(e){} };
  $("csvClose").onclick = function(){ show($("csvModal"), false); };
  $("clearData").onclick = function(){
    if(confirm("すべての売上データを消去します。よろしいですか？")){ txns = []; save(STORE, txns); renderSales(); }
  };

  /* ===== 売上（日付ごと） ===== */
  function fmtDate(d){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return esc(d);
    var y = +m[1], mo = +m[2], da = +m[3];
    var w = ["日","月","火","水","木","金","土"][new Date(y, mo-1, da).getDay()];
    return y + "年" + mo + "月" + da + "日(" + w + ")";
  }
  function renderSales(){
    var gt = 0, i, k, dayMap = {}, dayList = [];
    for(i=0;i<txns.length;i++){
      gt += txns[i].total;
      var dk = txns[i].date;
      if(!dayMap[dk]){ dayMap[dk] = []; dayList.push(dk); }
      dayMap[dk].push(txns[i]);
    }
    $("gTotal").innerHTML = yen(gt);
    $("gCount").innerHTML = txns.length;
    $("gDays").innerHTML = dayList.length;
    $("tabCnt").innerHTML = txns.length ? "(" + txns.length + ")" : "";
    if(!txns.length){ $("days").innerHTML = '<div class="day"><div class="empty">まだ会計がありません</div></div>'; return; }

    dayList.sort(); dayList.reverse();
    var out = "";
    for(var di=0; di<dayList.length; di++){
      var date = dayList[di], dt = dayMap[date];
      var dTot = 0, dGross = 0, dDisc = 0, dQty = 0, evs = {}, evList = [], agg = {}, order = [];
      for(i=0;i<dt.length;i++){
        var t = dt[i];
        dTot += t.total; dGross += (t.subtotal != null ? t.subtotal : t.total); dDisc += (t.discount || 0);
        if(t.event && !evs[t.event]){ evs[t.event] = 1; evList.push(t.event); }
        for(k=0;k<t.items.length;k++){
          var it = t.items[k], u = it.unit != null ? it.unit : it.price;
          dQty += it.count;
          if(!agg[it.name]){ agg[it.name] = {c:0, a:0, d:0}; order.push(it.name); }
          agg[it.name].c += it.count; agg[it.name].a += u * it.count; agg[it.name].d += (it.price - u) * it.count;
        }
      }
      var rows = "";
      for(i=0;i<order.length;i++){
        var g = agg[order[i]];
        rows += '<tr><td>'+esc(order[i])+'</td><td><span class="c">'+g.c+'</span> 個'+(g.d>0?'<span class="dc">値引-'+yen(g.d)+'</span>':'')+'</td><td class="r">'+yen(g.a)+'</td></tr>';
      }
      var txh = "";
      for(i=dt.length-1;i>=0;i--){
        var tt = dt[i], lines = [], det = [];
        for(k=0;k<tt.items.length;k++){
          var x = tt.items[k], xu = x.unit != null ? x.unit : x.price;
          lines.push(esc(x.name) + "×" + x.count);
          if(x.price - xu > 0) det.push(esc(x.name) + " -" + yen((x.price - xu) * x.count));
        }
        txh += '<div class="tx'+(tt.discount>0?' d':'')+'"><div class="h"><span class="no">No.'+tt.id+'</span><span class="tm">'+esc(tt.time)+'</span><span class="a">'+yen(tt.total)+'</span></div>' +
          '<div class="l">'+lines.join("　")+'　(預'+yen(tt.received)+'/釣'+yen(tt.change)+')</div>' +
          (tt.discount>0 ? '<div class="dr">値引 合計 -'+yen(tt.discount)+'　（'+det.join("　")+'）</div>' : '') + '</div>';
      }
      out += '<div class="day"><div class="dh"><span class="s">'+yen(dTot)+'</span><span class="d">'+fmtDate(date)+'</span>' +
        '<span class="e">'+(evList.length ? esc(evList.join(" / ")) : "（イベント名なし）")+'</span>' +
        '<div class="m">会計 '+dt.length+'件 ／ 販売 '+dQty+'点'+(dDisc>0 ? ' ／ <b>値引 -'+yen(dDisc)+'</b>（定価計 '+yen(dGross)+'）' : '')+'</div></div>' +
        '<div class="db"><h4>品目別（実売）</h4><table>'+rows+'</table><h4>会計履歴</h4>'+txh+'</div></div>';
    }
    $("days").innerHTML = out;
  }

  /* ===== トースト ===== */
  var tTimer = null;
  function toast(msg, ms){
    var t = $("toast"); t.innerHTML = esc(msg); toggleClass(t, "show", true);
    if(tTimer) clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toggleClass(t, "show", false); }, ms || 1000);
  }

  render(); renderSales();
})();
</script>
</body>
</html>
